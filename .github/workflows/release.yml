name: attach-release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach assets to'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk guardianlink-surface-v0.1.0-debug.apk
          gh release upload "$TAG" \
            guardianlink-surface-v0.1.0-debug.apk \
            release-assets/guardianlink-surface-harness-2026-10-23.zip \
            --clobber
